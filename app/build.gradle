
plugins {
    id 'com.android.application'
}

android {
    namespace 'app.cariya.id'
    compileSdk 36

    defaultConfig {
        applicationId 'app.cariya.id'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('CARIYA_KEYSTORE_PATH'))
            storePassword System.getenv('CARIYA_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CARIYA_KEY_ALIAS')
            keyPassword System.getenv('CARIYA_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
